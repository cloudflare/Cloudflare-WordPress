name: Test Build Artifact

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Build plugin
      uses: ./.github/actions/build-plugin

    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: build-artifact
        path: build/
        retention-days: 1

    - name: Install dev dependencies
      run: composer install --prefer-dist --no-progress

    - name: Upload dev vendor
      uses: actions/upload-artifact@v6
      with:
        name: vendor-dev
        path: vendor/
        retention-days: 1

  syntax-check:
    name: Syntax Check (build artifact, PHP ${{ matrix.php-versions }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}

    - name: Download build artifact
      uses: actions/download-artifact@v7
      with:
        name: build-artifact
        path: build/

    - name: PHP syntax check
      run: for f in $(find build/ -name '*.php'); do php -l $f; RETVAL=$?; if [ $RETVAL -ne 0 ]; then exit $RETVAL; fi; done

  test-build:
    name: Test build (PHP ${{ matrix.php-versions }}${{ matrix.extensions == 'intl' && ' + intl' || '' }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        extensions: ['intl', 'none']

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: ${{ matrix.extensions == 'none' && '-intl' || 'intl' }}

    - name: Download build artifact
      uses: actions/download-artifact@v7
      with:
        name: build-artifact
        path: build/

    - name: Download dev vendor
      uses: actions/download-artifact@v7
      with:
        name: vendor-dev
        path: vendor/

    - name: Verify intl extension status
      run: |
        if [ "${{ matrix.extensions }}" = "intl" ]; then
          php -m | grep -q intl && echo "✓ intl extension is loaded" || (echo "✗ intl extension should be loaded" && exit 1)
        else
          php -m | grep -q intl && (echo "✗ intl extension should NOT be loaded" && exit 1) || echo "✓ intl extension is not loaded (testing polyfill)"
        fi

    - name: Run tests against build artifact
      run: composer run-script test:build

  integration-build:
    name: Integration tests (build artifact in wp-env)
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none

    - name: Download build artifact
      uses: actions/download-artifact@v7
      with:
        name: build-artifact
        path: build/

    # PHPUnit and the integration tests, run from the source checkout.
    - name: Download dev vendor
      uses: actions/download-artifact@v7
      with:
        name: vendor-dev
        path: vendor/

    - uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: npm

    - name: Install npm dependencies
      run: npm ci --no-audit --no-fund

    - name: Install Chromium for the browser tests
      run: npx playwright install --with-deps chromium

    # Mounts build/ as the plugins folder, next to a conflicting psr/log.
    - name: Start WordPress with the build (wp-env)
      run: npm run env:build:start

    - name: Run integration tests against the build
      run: npm run test:integration:build

    - name: Run browser tests against the build
      run: npm run test:e2e:build

    - name: Upload browser test results
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: browser-test-results-build
        path: tests/E2E/.results/
        retention-days: 14
        if-no-files-found: ignore
